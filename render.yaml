services:
  - type: web
    name: hungry-buddy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_FILE
        value: /opt/render/project/src/data/hungry-buddy.db
    disk:
      name: hungry-buddy-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
